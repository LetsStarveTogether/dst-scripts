name: Update

on:
  schedule:
    # Avoid top-of-hour load.
    - cron: '9-59/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDS_URL: https://s3.amazonaws.com/dstbuilds/builds.json

jobs:
  detect:
    name: Detect versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - name: Detect versions
        id: detect
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs/promises');

            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: context.sha,
            });
            const currentVersion = Number(commit.commit.message);
            if (!Number.isSafeInteger(currentVersion)) {
              throw new Error(`Invalid version commit: ${commit.commit.message}`);
            }

            const response = await fetch(process.env.BUILDS_URL);
            if (!response.ok) {
              throw new Error(`Failed to fetch builds.json: ${response.status} ${response.statusText}`);
            }

            const builds = await response.json();
            const latestVersion = (channel) => Math.max(
              ...(Array.isArray(builds[channel]) ? builds[channel] : [])
                .filter((value) => /^\d+$/.test(String(value)))
                .map(Number)
                .filter(Number.isSafeInteger),
            );
            const versions = [...new Set(['release', 'updatebeta'].map(latestVersion))]
              .filter((value) => Number.isSafeInteger(value) && value > currentVersion)
              .sort((left, right) => left - right);

            core.setOutput('versions', JSON.stringify(versions));
            await fs.appendFile(
              process.env.GITHUB_STEP_SUMMARY,
              versions.length ? `Need Update ${currentVersion} -> ${versions.join(', ')}\n` : `Skip Update ${currentVersion}\n`,
            );

  collect:
    name: Collect scripts
    needs: detect
    if: needs.detect.outputs.versions != '[]'
    runs-on: ubuntu-latest
    outputs:
      updates: ${{ steps.scripts.outputs.updates }}
      versions: ${{ steps.scripts.outputs.versions }}
    steps:
      - name: Set up SteamCMD
        uses: buildalon/setup-steamcmd@v1

      - name: Collect matching scripts
        id: scripts
        env:
          CANDIDATE_VERSIONS: ${{ join(fromJSON(needs.detect.outputs.versions), ' ') }}
          HOME: ${{ runner.temp }}/steam-home
        shell: bash
        run: |
          set -euo pipefail

          artifacts_dir="${RUNNER_TEMP}/dst-scripts-artifacts"
          install_root="${RUNNER_TEMP}/dst-steam-install"
          collected_updates=()

          mkdir -p -- "${artifacts_dir}" "${HOME}"

          collect_branch() {
            local branch="$1"
            local build_target="$2"
            local install_dir="${install_root}/${branch}"
            local version_file="${install_dir}/version.txt"
            local scripts_zip="${install_dir}/data/databundles/scripts.zip"
            local version
            local destination
            local update_args=(+@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 +force_install_dir "${install_dir}" +login anonymous +app_update 343050)

            mkdir -p -- "${install_dir}"

            if [[ "${branch}" != "public" ]]; then
              update_args+=(-beta "${branch}")
            fi
            update_args+=(validate +quit)
            steamcmd "${update_args[@]}"

            version="$(tr -cd '0-9' < "${version_file}")"
            [[ -n "${version}" ]] || { echo "No numeric version was found for ${branch}" >&2; exit 1; }

            if [[ " ${CANDIDATE_VERSIONS} " != *" ${version} "* ]]; then
              echo "${branch} resolved to ${version}, which is not a candidate"
              return
            fi

            destination="${artifacts_dir}/scripts-${version}.zip"
            [[ -e "${destination}" ]] || cp -- "${scripts_zip}" "${destination}"
            collected_updates+=("${build_target}:${version}")
          }

          collect_branch public latest
          collect_branch updatebeta beta

          if [[ "${#collected_updates[@]}" -eq 0 ]]; then
            echo 'Skip Collect: no matching scripts' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          versions_text="$(printf '%s\n' "${collected_updates[@]#*:}" | sort -nu | paste -sd ' ' -)"
          updates_text="$(printf '%s\n' "${collected_updates[@]}" | sort -u -t: -k2,2n -k1,1 | paste -sd ' ' -)"

          echo "updates=${updates_text}" >> "${GITHUB_OUTPUT}"
          echo "versions=${versions_text}" >> "${GITHUB_OUTPUT}"
          echo "Collected Scripts ${updates_text}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload scripts
        if: steps.scripts.outputs.versions != ''
        uses: actions/upload-artifact@v7
        with:
          name: dst-scripts-zips
          path: ${{ runner.temp }}/dst-scripts-artifacts/scripts-*.zip
          if-no-files-found: error

  commit:
    name: Commit scripts
    needs: collect
    if: needs.collect.outputs.versions != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Download scripts
        uses: actions/download-artifact@v8
        with:
          name: dst-scripts-zips
          path: ${{ runner.temp }}/dst-scripts-zips

      - name: Commit scripts
        id: commit
        env:
          VERSIONS: ${{ needs.collect.outputs.versions }}
        run: |
          set -euo pipefail

          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'

          committed_versions=()
          extract_dir="${RUNNER_TEMP}/extracted-scripts"
          read -r -a versions <<< "${VERSIONS}"
          for version in "${versions[@]}"; do
            zip_file="${RUNNER_TEMP}/dst-scripts-zips/scripts-${version}.zip"

            rm -rf -- "${extract_dir}"
            unzip -q "${zip_file}" -d "${extract_dir}"

            rsync -a --delete --exclude='/.git/' --exclude='/.github/' "${extract_dir}/scripts/" "${GITHUB_WORKSPACE}/"

            git add -A
            if git diff --cached --quiet; then
              echo "No changes for ${version}"
              continue
            fi

            git commit --author='WH-2099 <wh2099@pm.me>' -m "${version}"
            committed_versions+=("${version}")
          done

          if [[ "${#committed_versions[@]}" -eq 0 ]]; then
            echo "Skip Commit ${VERSIONS}: no changes" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "Commit Scripts ${committed_versions[*]}" >> "${GITHUB_STEP_SUMMARY}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "versions=${committed_versions[*]}" >> "${GITHUB_OUTPUT}"

      - name: Trigger image builds
        if: steps.commit.outputs.versions != ''
        uses: actions/github-script@v9
        env:
          COMMITTED_VERSIONS: ${{ steps.commit.outputs.versions }}
          UPDATES: ${{ needs.collect.outputs.updates }}
        with:
          github-token: ${{ secrets.DST_SERVER_ACTIONS_TOKEN }}
          script: |
            const fs = require('node:fs/promises');

            const committedVersions = new Set(process.env.COMMITTED_VERSIONS.split(/\s+/));
            const triggered = [];

            for (const update of process.env.UPDATES.split(/\s+/)) {
              const [buildTarget, gameVersion] = update.split(':');
              if (!committedVersions.has(gameVersion)) {
                continue;
              }

              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: 'dst-server',
                workflow_id: 'image.yml',
                ref: 'main',
                inputs: {
                  build_target: buildTarget,
                  game_version: gameVersion,
                },
              });
              triggered.push(update);
            }

            await fs.appendFile(
              process.env.GITHUB_STEP_SUMMARY,
              `Trigger Image Builds ${triggered.join(' ')}\n`,
            );
